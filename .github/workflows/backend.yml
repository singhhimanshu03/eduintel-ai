name: Backend Services CI

on:
  push:
    branches: [main, develop]
    paths: ['services/**', 'ai-service/**']
  pull_request:
    branches: [main]
    paths: ['services/**', 'ai-service/**']

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - student-service
          - faculty-service
          - attendance-service
          - examination-service
          - fee-service
          - notification-service
          - placement-service
          - analytics-service
          - api-gateway

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm install

      - name: Type check
        working-directory: services/${{ matrix.service }}
        run: npx tsc --noEmit

      - name: Build
        working-directory: services/${{ matrix.service }}
        run: npm run build

  ai-service:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ai-service
        run: pip install -r requirements.txt

      - name: Syntax check — all Python files
        working-directory: ai-service
        run: |
          python -m py_compile app/main.py
          python -m py_compile app/routers/eligibility.py
          python -m py_compile app/routers/performance.py
          python -m py_compile app/routers/dropout.py
          python -m py_compile app/routers/forecast.py
          python -m py_compile app/routers/recommendations.py
          python -m py_compile app/routers/placement_ai.py
          python -m py_compile app/routers/faculty_ai.py
          python -m py_compile app/services/feature_engineering.py
          python -m py_compile app/services/model_loader.py
          python -m py_compile app/models/eligibility_model.py
          python -m py_compile app/models/performance_model.py
          python -m py_compile app/models/dropout_model.py
          python -m py_compile app/models/forecast_model.py
          python -m py_compile app/schemas/eligibility.py
          python -m py_compile app/schemas/performance.py
          python -m py_compile app/schemas/dropout.py
          python -m py_compile app/schemas/forecast.py
          python -m py_compile app/schemas/placement.py
          python -m py_compile app/schemas/recommendations.py

      - name: Run FastAPI startup check
        working-directory: ai-service
        run: |
          python -c "from app.main import app; print('FastAPI app loaded OK')"
        env:
          INTERNAL_SERVICE_SECRET: ci-test-secret
          MODEL_DIR: /tmp/models
